openapi: 3.0.3
info:
  title: Aether AI Gateway
  version: 1.0.0
  description: 'HTTP API for user, session, and improvement plan report workflows in the Aether core gateway. Most /ai routes require an ms-auth Bearer access token; POST /ai/report expects the internal authentication-key header. Every response carries an X-Request-Id header: the identifier of that request in the hub_metrics base.'
servers:
  - url: /
tags:
  - name: Users
    description: Endpoints for retrieving user profile data used by the AI gateway.
  - name: Sessions
    description: Endpoints for listing sessions, reading message history, and sending AI messages.
  - name: Reports
    description: Endpoints for analyzing inventories and reading the stored textual improvement plan.
paths:
  /ai/user/{id_external_user}:
    get:
      tags:
        - Users
      summary: Get user by external identifier
      description: Retrieves a user profile using the external user identifier stored in the core database.
      operationId: getUserByExternalId
      security:
        - MsAuthBearer: []
      parameters:
        - name: id_external_user
          in: path
          required: true
          description: External user identifier.
          schema:
            type: integer
          example: 12345
      responses:
        '200':
          description: User profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseData'
              example:
                id_external_user: 12345
                role: analyst
                usecase: report_generation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: User with id_external_user 12345 not found.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving user: Error fetching user from database: ...'
  /ai/sessions/cost:
    get:
      tags:
        - Sessions
      summary: Sum session and SDK cost for a company
      description: Returns USD spent in the last n days by runs that snapshotted the given company, grouped by external user.
      operationId: getCompanySessionCost
      security:
        - MsAuthBearer: []
      parameters:
        - name: n
          in: query
          required: true
          description: Number of trailing days to include.
          schema:
            type: integer
          example: 7
        - name: id_external_company
          in: query
          required: true
          description: External company identifier snapshotted on billed runs.
          schema:
            type: integer
          example: 90
      responses:
        '200':
          description: Company cost for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCostResponseData'
              example:
                id_external_company: 90
                cost_usd: 0.45
                users:
                  - id_external_user: 1
                    cost_usd: 0.25
                  - id_external_user: 2
                    cost_usd: 0.20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: n or id_external_company is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: n must be a positive integer.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving company cost: ...'
  /ai/sessions/user/{id_external_user}:
    get:
      tags:
        - Sessions
      summary: List sessions for a user
      description: Returns all sessions associated with the external user identifier.
      operationId: listUserSessions
      security:
        - MsAuthBearer: []
      parameters:
        - name: id_external_user
          in: path
          required: true
          description: External user identifier.
          schema:
            type: integer
          example: 12345
      responses:
        '200':
          description: Sessions found for the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponseData'
              example:
                - id: 65a8b3d6c0f8e1d7f4b2c001
                  name: Weekly emissions review
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The path user does not match the access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: id_external_user does not match the access token.
        '404':
          description: No sessions found for the given user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: No sessions found for user with id_user 65a8b3d6c0f8e1d7f4b2c010.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving user sessions: ...'
  /ai/session/{id_session}/messages:
    get:
      tags:
        - Sessions
      summary: List messages for a session
      description: Returns the message history stored for a specific session.
      operationId: listSessionMessages
      security:
        - MsAuthBearer: []
      parameters:
        - name: id_session
          in: path
          required: true
          description: Internal session identifier.
          schema:
            type: string
          example: 65a8b3d6c0f8e1d7f4b2c001
      responses:
        '200':
          description: Messages found for the session.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseData'
              example:
                - input_message: Summarize this session.
                  output_message: Here is the summary.
                  submitted_at: '2026-07-26T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: The session identifier is invalid or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: No session found with id_session 65a8b3d6c0f8e1d7f4b2c001.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving session messages: ...'
  /ai/user/session/message:
    post:
      tags:
        - Sessions
      summary: Send a message to the AI session
      description: Creates or continues a session message exchange, running the Aeko messenger for the asking user.
      operationId: sendSessionMessage
      security:
        - MsAuthBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              id_session: 65a8b3d6c0f8e1d7f4b2c001
              input: Summarize this session.
              id_external_user: 12345
              id_external_company: 90
      responses:
        '200':
          description: Message processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponseData'
              example:
                input_message: Summarize this session.
                output_message: Here is the summary.
                submitted_at: '2026-07-26T14:30:00Z'
                id_session: 65a8b3d6c0f8e1d7f4b2c001
                session_name: Weekly emissions review
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: The request body is missing required fields or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: User is not allowed to access this session.
        '422':
          description: Neither the output guardrail nor the response checker approved a draft, so the run produced no answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: No answer for this turn was approved by the output guardrail or the response checker. Please rephrase.
        '500':
          description: The Aeko SDK is not initialized or an unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Aeko SDK is not initialized
  /ai/report:
    post:
      tags:
        - Reports
      summary: Analyze an inventory and return the structured extraction
      description: Accepts inventory Markdown and the catalogs in force, runs them through the Aeko analyst flow with the current plan for that inventory as context, stores the new plan, and returns the structured inventory for Postgres persistence.
      operationId: analyzeInventoryReport
      security:
        - InventoryReportAuthenticationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestData'
            example:
              id_external_context_inventory: 502
              inventory: '## Escopo 1'
              id_external_user: 12345
              gases:
                - id: 1
                  name: CO2
              scopes:
                - id: 1
                  name: Escopo 1
              categories:
                - id: 1
                  name: Combustão estacionária
                  classification: null
      responses:
        '200':
          description: Structured inventory extracted from the analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedInventoryData'
              example:
                description: Boiler-dominated inventory
                start_period: '2025-01-01'
                end_period: '2025-12-31'
                emissions:
                  - quantity_co2e: 12400.0
                    methodology_description: stationary combustion
                    supplier_data_percentage: null
                    gas: 1
                    scope: 1
                    category: null
                    is_upstream: null
                    is_reduction: false
        '401':
          description: Missing or invalid authentication-key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  value:
                    detail: Missing authentication key.
                invalid:
                  value:
                    detail: Invalid authentication key.
        '400':
          description: The inventory Markdown is empty or a domain catalog rule was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: inventory is required to analyze an inventory.
        '404':
          description: A domain resource referenced by the request was not found (for example, the improvement plan for the inventory).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Improvement plan with id_external_inventory 502 not found.
        '422':
          description: The analysis produced no plan or structured inventory in the expected shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: The analysis produced no plan in the shape a report is stored in.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: The Aeko SDK is not initialized or an unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error processing report: ...'
  /ai/report/{id_external_inventory}:
    get:
      tags:
        - Reports
      summary: Get the textual improvement plan for an inventory
      description: Returns the stored improvement plan for the external inventory identifier.
      operationId: getInventoryImprovementPlan
      security:
        - MsAuthBearer: []
      parameters:
        - name: id_external_inventory
          in: path
          required: true
          description: External inventory identifier whose plan should be returned.
          schema:
            type: integer
          example: 502
      responses:
        '200':
          description: Textual improvement plan found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImprovementPlanReportData'
              example:
                defined_problem: high scope 1 emissions
                solving_method: replace the boiler fleet
                reasoning: direct combustion dominates the inventory
                recommended_gases:
                  - scope: 1
                    emission: 120.5
                    reduction_percentage: 35.25
                    name: Biometano
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No improvement plan exists for the supplied inventory identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Improvement plan with id_external_inventory 502 not found.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving report: ...'
components:
  securitySchemes:
    MsAuthBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ms-auth access token from login or the ChatGPT OAuth exchange.
    InventoryReportAuthenticationKey:
      type: apiKey
      in: header
      name: authentication-key
      description: Shared secret for internal service authentication (INTERNAL_AUTHENTICATION_KEY).
  responses:
    Unauthorized:
      description: Missing or invalid ms-auth Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Missing access token.
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    UserResponseData:
      type: object
      properties:
        id_external_user:
          type: integer
          description: External identifier of the user.
          example: 12345
        role:
          type: string
          description: Role assigned to the user.
          example: analyst
        usecase:
          type: string
          description: User use case or profile category.
          example: report_generation
      required:
        - id_external_user
        - role
        - usecase
    UserCostResponseData:
      type: object
      properties:
        id_external_user:
          type: integer
          description: External user identifier whose runs were billed.
          example: 12345
        cost_usd:
          type: number
          format: float
          description: USD spent by this user in the requested window.
          example: 0.25
      required:
        - id_external_user
        - cost_usd
    CompanyCostResponseData:
      type: object
      properties:
        id_external_company:
          type: integer
          description: External company identifier snapshotted on the billed runs.
          example: 90
        cost_usd:
          type: number
          format: float
          description: USD spent by every user of this company in the requested window.
          example: 0.45
        users:
          type: array
          description: Per-user USD totals inside the same window.
          items:
            $ref: '#/components/schemas/UserCostResponseData'
      required:
        - id_external_company
        - cost_usd
        - users
    SessionResponseData:
      type: object
      properties:
        id:
          type: string
          description: Internal session identifier.
          example: 65a8b3d6c0f8e1d7f4b2c001
        name:
          type: string
          description: Human-readable session name.
          example: Weekly emissions review
      required:
        - id
        - name
    MessageResponseData:
      type: object
      properties:
        input_message:
          type: string
          description: Input text sent to the AI agent.
          example: Summarize this session.
        output_message:
          type: string
          description: Output returned by the AI agent.
          example: Here is the summary.
        submitted_at:
          type: string
          format: date-time
          description: Timestamp when the message was submitted.
          example: '2026-07-26T14:30:00Z'
      required:
        - input_message
        - output_message
        - submitted_at
    SendMessageResponseData:
      allOf:
        - $ref: '#/components/schemas/MessageResponseData'
        - type: object
          required:
            - id_session
            - session_name
          properties:
            id_session:
              type: string
              description: Internal session identifier of the conversation turn.
              example: 65a8b3d6c0f8e1d7f4b2c001
            session_name:
              type: string
              description: Human-readable session name after the turn was stored.
              example: Weekly emissions review
    SendMessageRequest:
      type: object
      required:
        - id_external_user
        - id_external_company
      properties:
        id_session:
          type: string
          description: Optional session identifier. Omit or send an empty value to create a new session.
          example: 65a8b3d6c0f8e1d7f4b2c001
        input:
          type: string
          description: Message text to send to the AI agent.
          example: Summarize this session.
        id_external_user:
          type: integer
          description: External user identifier used to resolve or create the Mongo user.
          example: 12345
        id_external_company:
          type: integer
          description: External company identifier stored when a new user is created.
          example: 90
    ReportRequestData:
      type: object
      properties:
        id_external_context_inventory:
          type: integer
          description: External inventory identifier analyzed and stored on the resulting plan.
          example: 502
        inventory:
          type: string
          description: Inventory content as Markdown.
          example: '## Escopo 1'
        id_external_user:
          type: integer
          description: External user identifier responsible for the report.
          example: 12345
        gases:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemData'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemData'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCatalogItemData'
      required:
        - id_external_context_inventory
        - inventory
        - id_external_user
        - gases
        - scopes
        - categories
    CatalogItemData:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: CO2
      required:
        - id
        - name
    CategoryCatalogItemData:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Combustão estacionária
        classification:
          type: string
          nullable: true
          enum:
            - UPSTREAM
            - DOWNSTREAM
            - null
          example: null
      required:
        - id
        - name
    ExtractedInventoryData:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: Short description of the analyzed inventory.
          example: Boiler-dominated inventory
        start_period:
          type: string
          nullable: true
          description: Start of the inventory period.
          example: '2025-01-01'
        end_period:
          type: string
          nullable: true
          description: End of the inventory period.
          example: '2025-12-31'
        emissions:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEmissionData'
      required:
        - description
        - start_period
        - end_period
        - emissions
    InventoryEmissionData:
      type: object
      properties:
        quantity_co2e:
          type: number
          format: float
          example: 12400.0
        methodology_description:
          type: string
          nullable: true
          example: stationary combustion
        supplier_data_percentage:
          type: number
          format: float
          nullable: true
          example: null
        gas:
          type: integer
          nullable: true
          example: 1
        scope:
          type: integer
          nullable: true
          example: 1
        category:
          type: integer
          nullable: true
          example: null
        is_upstream:
          type: boolean
          nullable: true
          example: null
        is_reduction:
          type: boolean
          example: false
      required:
        - quantity_co2e
        - methodology_description
        - supplier_data_percentage
        - gas
        - scope
        - category
        - is_upstream
        - is_reduction
    ImprovementPlanReportData:
      type: object
      properties:
        defined_problem:
          type: string
          description: Problem the analysis identified.
          example: high scope 1 emissions
        solving_method:
          type: string
          description: What the plan proposes doing about it.
          example: replace the boiler fleet
        reasoning:
          type: string
          description: Why that method addresses that problem.
          example: direct combustion dominates the inventory
        recommended_gases:
          type: array
          maxItems: 2
          description: Up to 2 recommended gas substitutions, with emission in tCO2e. Empty when no substitution applies.
          items:
            $ref: '#/components/schemas/RecommendedGasData'
      required:
        - defined_problem
        - solving_method
        - reasoning
        - recommended_gases
    RecommendedGasData:
      type: object
      properties:
        scope:
          type: integer
          minimum: 1
          maximum: 3
          description: GHG scope number (1, 2 or 3) the substitution applies to.
          example: 1
        emission:
          type: number
          minimum: 0
          description: Projected emission after the swap, in tCO2e.
          example: 120.5
        reduction_percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Drop versus the current emission of the replaced gas, in percent.
          example: 35.25
        name:
          type: string
          minLength: 1
          description: Substitute gas to adopt.
          example: Biometano
      required:
        - scope
        - emission
        - reduction_percentage
        - name
