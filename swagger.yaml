openapi: 3.0.3
info:
  title: Aether AI Gateway
  version: 1.0.0
  description: 'HTTP API for user, session, and improvement plan report workflows in the Aether core gateway. Every response carries an X-Request-Id header: the identifier of that request in the hub_metrics base.'
servers:
  - url: /
tags:
  - name: Users
    description: Endpoints for retrieving user profile data used by the AI gateway.
  - name: Sessions
    description: Endpoints for listing sessions, reading message history, and sending AI messages.
  - name: Reports
    description: Endpoints for analyzing inventories and reading the stored textual improvement plan.
  - name: Metrics
    description: 'Endpoints for reading the event tracking bases behind the observability dashboard: what the gateway did with each request, and what the AI run inside it cost.'

paths:
  /aether-api/v1/ai/user/{id_external_user}:
    get:
      tags:
        - Users
      summary: Get user by external identifier
      description: Retrieves a user profile using the external user identifier stored in the core database.
      operationId: getUserByExternalId
      parameters:
        - name: id_external_user
          in: path
          required: true
          description: External user identifier.
          schema:
            type: integer
          example: 12345
      responses:
        '200':
          description: User profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseData'
              example:
                id_external_user: 12345
                role: analyst
                usecase: report_generation
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: User with id_external_user 12345 not found.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving user: Error fetching user from database: ...'
  /aether-api/v1/ai/sessions/user/{id_user}:
    get:
      tags:
        - Sessions
      summary: List sessions for a user
      description: Returns all sessions associated with the internal user identifier.
      operationId: listUserSessions
      parameters:
        - name: id_user
          in: path
          required: true
          description: Internal user identifier.
          schema:
            type: string
          example: 65a8b3d6c0f8e1d7f4b2c010
      responses:
        '200':
          description: Sessions found for the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponseData'
              example:
                - id: 65a8b3d6c0f8e1d7f4b2c001
                  name: Weekly emissions review
        '404':
          description: No sessions found for the given user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: No sessions found for user with id_user 65a8b3d6c0f8e1d7f4b2c010.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving user sessions: ...'
  /aether-api/v1/ai/session/{id_session}/messages:
    get:
      tags:
        - Sessions
      summary: List messages for a session
      description: Returns the message history stored for a specific session.
      operationId: listSessionMessages
      parameters:
        - name: id_session
          in: path
          required: true
          description: Internal session identifier.
          schema:
            type: string
          example: 65a8b3d6c0f8e1d7f4b2c001
      responses:
        '200':
          description: Messages found for the session.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseData'
              example:
                - input_message: Summarize this session.
                  output_message: Here is the summary.
                  submitted_at: '2026-07-26T14:30:00Z'
        '400':
          description: The session identifier is invalid or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: No session found with id_session 65a8b3d6c0f8e1d7f4b2c001.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving session messages: ...'
  /aether-api/v1/ai/user/session/message:
    post:
      tags:
        - Sessions
      summary: Send a message to the AI session
      description: Creates or continues a session message exchange, running the Aeko messenger for the asking user.
      operationId: sendSessionMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              id_session: 65a8b3d6c0f8e1d7f4b2c001
              input: Summarize this session.
              id_user: 65a8b3d6c0f8e1d7f4b2c010
      responses:
        '200':
          description: Message processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseData'
              example:
                input_message: Summarize this session.
                output_message: Here is the summary.
                submitted_at: '2026-07-26T14:30:00Z'
        '400':
          description: The request body is missing required fields or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: User is not allowed to access this session.
        '502':
          description: Neither the output guardrail nor the response checker approved a draft, so the run produced no answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: No answer for this turn was approved by the output guardrail or the response checker. Please rephrase.
        '500':
          description: The Aeko SDK is not initialized or an unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Aeko SDK is not initialized
  /aether-api/v1/ai/report:
    post:
      tags:
        - Reports
      summary: Analyze an inventory and return the structured extraction
      description: Accepts inventory Markdown and the catalogs in force, runs them through the Aeko analyst flow with the current plan for that inventory as context, stores the new plan, and returns the structured inventory for Postgres persistence.
      operationId: analyzeInventoryReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestData'
            example:
              id_external_context_inventory: 502
              inventory: '## Escopo 1'
              id_external_user: 12345
              gases:
                - id: 1
                  name: CO2
              scopes:
                - id: 1
                  name: Escopo 1
              categories:
                - id: 1
                  name: Combustão estacionária
                  classification: null
      responses:
        '200':
          description: Structured inventory extracted from the analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedInventoryData'
              example:
                description: Boiler-dominated inventory
                start_period: '2025-01-01'
                end_period: '2025-12-31'
                emissions:
                  - quantity_co2e: 12400.0
                    methodology_description: stationary combustion
                    supplier_data_percentage: null
                    gas: 1
                    scope: 1
                    category: null
                    is_upstream: null
                    is_reduction: false
        '400':
          description: The inventory Markdown is empty or a domain catalog rule was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: inventory is required to analyze an inventory.
        '404':
          description: No user exists for the supplied external identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: User with id_external_user 12345 not found.
        '502':
          description: The analysis produced no plan or structured inventory in the expected shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: The analysis produced no plan in the shape a report is stored in.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: The Aeko SDK is not initialized or an unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error processing report: ...'
  /aether-api/v1/ai/report/{id_external_inventory}:
    get:
      tags:
        - Reports
      summary: Get the textual improvement plan for an inventory
      description: Returns the stored improvement plan for the external inventory identifier.
      operationId: getInventoryImprovementPlan
      parameters:
        - name: id_external_inventory
          in: path
          required: true
          description: External inventory identifier whose plan should be returned.
          schema:
            type: integer
          example: 502
      responses:
        '200':
          description: Textual improvement plan found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImprovementPlanReportData'
              example:
                defined_problem: high scope 1 emissions
                solving_method: replace the boiler fleet
                reasoning: direct combustion dominates the inventory
        '404':
          description: No improvement plan exists for the supplied inventory identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Improvement plan with id_external_inventory 502 not found.
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving report: ...'
  /aether-api/v1/ai/hub-metrics:
    get:
      tags:
        - Metrics
      summary: List every tracked request
      description: 'Returns the whole event tracking base: one row per request served by the gateway, as the observability dashboard reads it.'
      operationId: listHubMetrics
      responses:
        '200':
          description: Metrics found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricResponseData'
              example:
                - id: 65a8b3d6c0f8e1d7f4b2c0aa
                  latency: 12.4ms
                  response_status: 200
                  endpoint: /aether-api/v1/ai/user/{id_external_user}
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving metrics: ...'
  /aether-api/v1/ai/aeko-metrics:
    get:
      tags:
        - Metrics
      summary: List what every AI run cost
      description: 'Returns the whole Aeko event tracking base: one row per SDK run served by the gateway, with the agents it invoked, as the observability dashboard reads it.'
      operationId: listAekoMetrics
      responses:
        '200':
          description: Metrics found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AekoMetricResponseData'
              example:
                - id: 65a8b3d6c0f8e1d7f4b2c0bb
                  id_request: 65a8b3d6c0f8e1d7f4b2c0aa
                  latency: 4823
                  error_description: null
                  flow: conversational
                  used_agents:
                    - name: Analista de Poluentes
                      input_tokens: 11
                      output_tokens: 22
                      llm: gemini-3.5-flash
                      used_tools:
                        - climatiq_search
                        - calculator
        '503':
          description: Database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Database is not initialized
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: 'Error retrieving aeko metrics: ...'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    UserResponseData:
      type: object
      properties:
        id_external_user:
          type: integer
          description: External identifier of the user.
          example: 12345
        role:
          type: string
          description: Role assigned to the user.
          example: analyst
        usecase:
          type: string
          description: User use case or profile category.
          example: report_generation
      required:
        - id_external_user
        - role
        - usecase
    SessionResponseData:
      type: object
      properties:
        id:
          type: string
          description: Internal session identifier.
          example: 65a8b3d6c0f8e1d7f4b2c001
        name:
          type: string
          description: Human-readable session name.
          example: Weekly emissions review
      required:
        - id
        - name
    MessageResponseData:
      type: object
      properties:
        input_message:
          type: string
          description: Input text sent to the AI agent.
          example: Summarize this session.
        output_message:
          type: string
          description: Output returned by the AI agent.
          example: Here is the summary.
        submitted_at:
          type: string
          format: date-time
          description: Timestamp when the message was submitted.
          example: '2026-07-26T14:30:00Z'
      required:
        - input_message
        - output_message
        - submitted_at
    SendMessageRequest:
      type: object
      required:
        - id_session
        - input
        - id_user
      properties:
        id_session:
          type: string
          description: Optional session identifier. Omit or send an empty value to create a new session.
          example: 65a8b3d6c0f8e1d7f4b2c001
        input:
          type: string
          description: Message text to send to the AI agent.
          example: Summarize this session.
        id_user:
          type: string
          description: Internal user identifier.
          example: 65a8b3d6c0f8e1d7f4b2c010
    ReportRequestData:
      type: object
      properties:
        id_external_context_inventory:
          type: integer
          description: External inventory identifier analyzed and stored on the resulting plan.
          example: 502
        inventory:
          type: string
          description: Inventory content as Markdown.
          example: '## Escopo 1'
        id_external_user:
          type: integer
          description: External user identifier responsible for the report.
          example: 12345
        gases:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemData'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItemData'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCatalogItemData'
      required:
        - id_external_context_inventory
        - inventory
        - id_external_user
        - gases
        - scopes
        - categories
    CatalogItemData:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: CO2
      required:
        - id
        - name
    CategoryCatalogItemData:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Combustão estacionária
        classification:
          type: string
          nullable: true
          enum:
            - UPSTREAM
            - DOWNSTREAM
            - null
          example: null
      required:
        - id
        - name
    ExtractedInventoryData:
      type: object
      properties:
        description:
          type: string
          nullable: true
          description: Short description of the analyzed inventory.
          example: Boiler-dominated inventory
        start_period:
          type: string
          nullable: true
          description: Start of the inventory period.
          example: '2025-01-01'
        end_period:
          type: string
          nullable: true
          description: End of the inventory period.
          example: '2025-12-31'
        emissions:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEmissionData'
      required:
        - description
        - start_period
        - end_period
        - emissions
    InventoryEmissionData:
      type: object
      properties:
        quantity_co2e:
          type: number
          format: float
          example: 12400.0
        methodology_description:
          type: string
          nullable: true
          example: stationary combustion
        supplier_data_percentage:
          type: number
          format: float
          nullable: true
          example: null
        gas:
          type: integer
          nullable: true
          example: 1
        scope:
          type: integer
          nullable: true
          example: 1
        category:
          type: integer
          nullable: true
          example: null
        is_upstream:
          type: boolean
          nullable: true
          example: null
        is_reduction:
          type: boolean
          example: false
      required:
        - quantity_co2e
        - methodology_description
        - supplier_data_percentage
        - gas
        - scope
        - category
        - is_upstream
        - is_reduction
    ImprovementPlanReportData:
      type: object
      properties:
        defined_problem:
          type: string
          description: Problem the analysis identified.
          example: high scope 1 emissions
        solving_method:
          type: string
          description: What the plan proposes doing about it.
          example: replace the boiler fleet
        reasoning:
          type: string
          description: Why that method addresses that problem.
          example: direct combustion dominates the inventory
      required:
        - defined_problem
        - solving_method
        - reasoning
    MetricResponseData:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the tracked request, answered to its caller in the X-Request-Id header.
          example: 65a8b3d6c0f8e1d7f4b2c0aa
        latency:
          type: string
          description: How long the request took, in milliseconds.
          example: 12.4ms
        response_status:
          type: integer
          description: HTTP status the request answered with.
          example: 200
        endpoint:
          type: string
          description: Route template the request matched.
          example: /aether-api/v1/ai/user/{id_external_user}
      required:
        - id
        - latency
        - response_status
        - endpoint
    AgentMetricResponseData:
      type: object
      properties:
        name:
          type: string
          description: Agent that was invoked, under the exact name the SDK's graph routes it by.
          example: Analista de Poluentes
        input_tokens:
          type: integer
          description: Prompt tokens this single invocation consumed, its whole tool-calling loop included.
          example: 11
        output_tokens:
          type: integer
          description: Completion tokens this single invocation produced.
          example: 22
        llm:
          type: string
          description: Model that served the invocation. More than one name when the SDK's cross-model fallback fired inside the call.
          example: gemini-3.5-flash
        used_tools:
          type: array
          items:
            type: string
          description: Tools the agent actually called, in call order - not the ones registered for it.
          example:
            - climatiq_search
            - calculator
      required:
        - name
        - input_tokens
        - output_tokens
        - llm
        - used_tools
    AekoMetricResponseData:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the stored row.
          example: 65a8b3d6c0f8e1d7f4b2c0bb
        id_request:
          type: string
          description: The request this run belongs to, answered to its caller in the X-Request-Id header and stored as the identifier of its hub_metrics row.
          example: 65a8b3d6c0f8e1d7f4b2c0aa
        latency:
          type: integer
          description: How long the whole SDK run took, in whole milliseconds.
          example: 4823
        error_description:
          type: string
          nullable: true
          description: 'Why the run failed, or null when it did not. A conversational turn no reviewer approved is one of these: it delivers nothing, and this row is the only account left of what it cost.'
          example: null
        flow:
          type: string
          description: 'Which entry point served it: conversational for a chat turn, analytical for an inventory analysis.'
          enum:
            - conversational
            - analytical
          example: conversational
        used_agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentMetricResponseData'
          description: One entry per agent invocation, in call order. An agent a reviewer's retry loop called again is listed again.
      required:
        - id
        - id_request
        - latency
        - flow
        - used_agents
